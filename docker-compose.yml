# Runs the whole app: React (nginx) on port 80 + FastAPI backend.
# Locally:  docker compose up --build
# On EC2:   docker compose pull && docker compose up -d
services:
  backend:
    image: ${DOCKERHUB_USERNAME:-local}/churn-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    # No "ports": the backend is only reachable through nginx (frontend container)

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/churn-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
