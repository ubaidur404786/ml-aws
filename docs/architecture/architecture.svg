<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="860" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Local training -->
  <rect x="20" y="40" width="170" height="90" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="105" y="70" text-anchor="middle" font-weight="600">Local training</text>
  <text x="105" y="92" text-anchor="middle" fill="#475569">ml/train.py</text>
  <text x="105" y="112" text-anchor="middle" fill="#475569">scikit-learn</text>

  <rect x="20" y="180" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="105" y="210" text-anchor="middle" font-weight="600">Docker Hub</text>
  <text x="105" y="230" text-anchor="middle" fill="#475569">backend + frontend images</text>
  <line x1="105" y1="130" x2="105" y2="176" stroke="#475569" marker-end="url(#arrow)"/>
  <text x="112" y="158" fill="#475569" font-size="12">build &amp; push</text>

  <!-- EC2 box -->
  <rect x="250" y="20" width="590" height="260" rx="10" fill="#fff7ed" stroke="#f97316" stroke-dasharray="6 4"/>
  <text x="270" y="45" font-weight="600" fill="#c2410c">AWS EC2 (t3.micro) · Docker Compose</text>

  <rect x="280" y="110" width="120" height="60" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="340" y="137" text-anchor="middle" font-weight="600">Browser</text>
  <text x="340" y="156" text-anchor="middle" fill="#475569" font-size="12">port 80</text>

  <rect x="450" y="90" width="170" height="100" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="535" y="118" text-anchor="middle" font-weight="600">frontend container</text>
  <text x="535" y="140" text-anchor="middle" fill="#475569">nginx + React build</text>
  <text x="535" y="160" text-anchor="middle" fill="#475569" font-size="12">proxies /api/* →</text>

  <rect x="660" y="90" width="160" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="740" y="118" text-anchor="middle" font-weight="600">backend container</text>
  <text x="740" y="140" text-anchor="middle" fill="#475569">FastAPI :8000</text>
  <text x="740" y="160" text-anchor="middle" fill="#475569" font-size="12">churn_pipeline.joblib</text>

  <line x1="400" y1="140" x2="446" y2="140" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="620" y1="140" x2="656" y2="140" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="190" y1="215" x2="530" y2="215" stroke="#475569" stroke-dasharray="4 3"/>
  <line x1="530" y1="215" x2="530" y2="194" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="530" y1="215" x2="740" y2="215" stroke="#475569" stroke-dasharray="4 3"/>
  <line x1="740" y1="215" x2="740" y2="194" stroke="#475569" marker-end="url(#arrow)"/>
  <text x="560" y="240" fill="#475569" font-size="12">docker compose pull</text>
</svg>
